# Synthetic fixture of scripts/check-workflows.test.mjs: clean.yml with one
# planted fault, never recorded from a run and never run.
# Rule parse: a quoted string holds a literal newline, so its second line
# falls out of the run block scalar (the measure-feeds.yml defect of commit
# 5e7a646).
name: Clean

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: The day to read
        type: string
        default: '2026-10-26'

permissions: {}

concurrency:
  group: clean
  queue: max
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  measure-push:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the day through env
        env:
          DAY: ${{ inputs.day }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'day=%s
day' "$DAY"
          gh api "orgs/pkgforge-dev/packages/container/domains.pkgforge.dev%2Fprobe" --jq .visibility
      - name: Upload the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result
          path: result.json
          overwrite: true

  measure-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the successor
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run clean.yml --ref main --repo "$GITHUB_REPOSITORY"

  promote:
    needs: measure-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: root-writer
      queue: max
      cancel-in-progress: false
    steps:
      - name: Move latest to the dated root
        run: oras tag "ghcr.io/pkgforge-dev/domains.pkgforge.dev/root:r-20261026T000000Z" latest
